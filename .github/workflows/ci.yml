name: CI

on:
  push:
    branches: [main]
  pull_request:

# Новый пуш в ту же ветку отменяет устаревший прогон.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Тесты БД работают с настоящим PostgreSQL и создают в нём временные базы.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: nisha
          POSTGRES_PASSWORD: nisha
          POSTGRES_DB: nisha
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nisha -d nisha"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://nisha:nisha@localhost:5432/nisha

    steps:
      - uses: actions/checkout@v7

      # Версия pnpm берётся из поля packageManager в package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Бандл web совместим с Safari 14 (ES2020)
        run: pnpm --filter @nisha/web check:bundle

      - name: Браузеры Playwright
        run: pnpm --filter @nisha/web exec playwright install --with-deps chromium webkit

      # e2e работают с настоящим api и каталогом из сида.
      - name: База для e2e
        run: pnpm db:migrate && pnpm db:seed
        env:
          ADMIN_EMAIL: admin@nisha.test
          ADMIN_PASSWORD: ci-admin-password

      - run: pnpm test:e2e

      - name: Отчёт Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
