# Статика SPA. Проксирование /api на api появится вместе с production-compose (этап 10).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # У файлов сборки хеш в имени — их можно кешировать навсегда.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Клиентский роутинг: неизвестный путь отдаёт index.html, 404 рисует приложение.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
