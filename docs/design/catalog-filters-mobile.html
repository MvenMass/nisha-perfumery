<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ниша — фильтры каталога, мобильная</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Manrope:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#141312}
</style>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<div style="width: 360px; height: 780px; position: relative; overflow: hidden; font-family: 'Manrope', system-ui, sans-serif; color: #EDE6DB; background: #0C0B0B">

<div aria-hidden="true" style="position: absolute; top: 0; left: 0; right: 0; height: 120px; padding: 16px; opacity: 0.35">
<p style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 32px; text-transform: uppercase">Каталог</p>
</div>

<div role="dialog" aria-modal="true" aria-label="Фильтры" style="position: absolute; left: 0; right: 0; bottom: 0; top: 64px; background: #1B1A19; display: flex; flex-direction: column">
<div style="height: 64px; padding: 0 8px 0 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2E2B28">
<p style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 26px; text-transform: uppercase">Фильтры</p>
<button type="button" aria-label="Закрыть фильтры" style="width: 44px; height: 44px; background: transparent; border: 0; color: #EDE6DB; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>

<div style="flex: 1 1 auto; overflow-y: auto; padding: 0 16px">
<div style="padding: 20px 0; border-bottom: 1px solid #2E2B28; display: flex; flex-direction: column; gap: 12px">
<p style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #C27E54">СОРТИРОВКА</p>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" aria-pressed="true" style="min-height: 40px; padding: 0 14px; background: #2A1A12; border: 1px solid #C27E54; color: #EDE6DB; font-family: inherit; font-size: 13px">Популярные</button>
<button type="button" aria-pressed="false" style="min-height: 40px; padding: 0 14px; background: transparent; border: 1px solid #3A3633; color: #EDE6DB; font-family: inherit; font-size: 13px">Дешевле</button>
<button type="button" aria-pressed="false" style="min-height: 40px; padding: 0 14px; background: transparent; border: 1px solid #3A3633; color: #EDE6DB; font-family: inherit; font-size: 13px">Новинки</button>
</div>
</div>
<div style="padding: 20px 0; border-bottom: 1px solid #2E2B28; display: flex; flex-direction: column; gap: 12px">
<p style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #C27E54">МАТЕРИАЛ</p>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" aria-pressed="false" style="display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; background: transparent; border: 1px solid #3A3633; color: #EDE6DB; font-family: inherit; font-size: 13px"><span aria-hidden="true" style="width: 10px; height: 10px; background: #B8AA96"></span>Известняк</button>
<button type="button" aria-pressed="true" style="display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; background: #2A1A12; border: 1px solid #C27E54; color: #EDE6DB; font-family: inherit; font-size: 13px"><span aria-hidden="true" style="width: 10px; height: 10px; background: #292725; outline: 1px solid #887D70"></span>Базальт</button>
<button type="button" aria-pressed="true" style="display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; background: #2A1A12; border: 1px solid #C27E54; color: #EDE6DB; font-family: inherit; font-size: 13px"><span aria-hidden="true" style="width: 10px; height: 10px; background: #5A3A28"></span>Орех</button>
<button type="button" aria-pressed="false" style="display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; background: transparent; border: 1px solid #3A3633; color: #EDE6DB; font-family: inherit; font-size: 13px"><span aria-hidden="true" style="width: 10px; height: 10px; background: #887D70"></span>Травертин</button>
<button type="button" aria-pressed="false" style="display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; background: transparent; border: 1px solid #3A3633; color: #EDE6DB; font-family: inherit; font-size: 13px"><span aria-hidden="true" style="width: 10px; height: 10px; background: #A85A32"></span>Янтарь</button>
</div>
</div>
<div style="padding: 20px 0; border-bottom: 1px solid #2E2B28; display: flex; flex-direction: column; gap: 12px">
<p style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #C27E54">ОБЪЁМ</p>
<div style="display: flex; gap: 8px">
<span style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; min-height: 44px; border: 1px solid #3A3633; font-family: 'IBM Plex Mono', monospace; font-size: 12px">30&nbsp;мл</span>
<span style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; min-height: 44px; border: 1px solid #C27E54; background: #2A1A12; font-family: 'IBM Plex Mono', monospace; font-size: 12px">50&nbsp;мл</span>
<span style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; min-height: 44px; border: 1px solid #3A3633; font-family: 'IBM Plex Mono', monospace; font-size: 12px">100&nbsp;мл</span>
</div>
</div>
<details style="padding: 18px 0; border-bottom: 1px solid #2E2B28"><summary style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #C27E54; min-height: 24px">КАТЕГОРИЯ · 1</summary></details>
<details style="padding: 18px 0; border-bottom: 1px solid #2E2B28"><summary style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #C27E54; min-height: 24px">ЦЕНА</summary></details>
<details style="padding: 18px 0"><summary style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #C27E54; min-height: 24px">ПЛОТНОСТЬ · 1</summary></details>
</div>

<div style="padding: 12px 16px 20px; border-top: 1px solid #2E2B28; display: flex; gap: 8px; background: #1B1A19">
<button type="button" style="flex: 0 0 auto; min-height: 52px; padding: 0 18px; background: transparent; border: 1px solid #887D70; color: #EDE6DB; font-family: inherit; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase">Сбросить</button>
<button type="button" style="flex: 1 1 auto; min-height: 52px; background: #71351F; border: 0; color: #EDE6DB; font-family: inherit; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase">Показать 4&nbsp;образца</button>
</div>
</div>

</div>
</body>
</html>
